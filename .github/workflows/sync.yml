name: Sync Fork with Upstream

on:
  schedule:
    # 每天 UTC 时间 00:00 (即北京时间 08:00) 自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 页面上手动触发此动作

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 步骤一：检出你的代码
      - name: Checkout
        uses: actions/checkout@v4

      # 步骤二：配置 Git 用户
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 步骤三：添加上游仓库并合并
      - name: Merge Upstream
        run: |
          git remote add upstream https://github.com/waifu-project/movie.git
          git fetch upstream
          git checkout dev # 确保你在主分支上，如果不是 main，请改为你的分支名，如 master
          git merge upstream/dev
          git push origin dev
        env:
          # 这里需要一张具有写入权限的 Personal Access Token (PAT)
          # 非常重要！不能用默认的 GITHUB_TOKEN，因为它无权推送到 Fork 的仓库。
          GITHUB_TOKEN: ${{ secrets.PAT_FOR_SYNC }}