name: Sync with waifu-project/movie

on:
  schedule:
    # 每天 UTC 时间 00:00 (即北京时间 08:00) 自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev # 检出你的 dev 分支
          token: ${{ secrets.PAT_FOR_SYNC }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/waifu-project/movie.git
          git fetch upstream

      - name: Merge upstream changes
        run: |
          # 合并上游的 dev 分支到你的 dev 分支
          git merge upstream/dev --allow-unrelated-histories --no-edit
          
      - name: Push changes
        run: |
          git push origin dev